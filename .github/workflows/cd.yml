name: CD Workflow (Main)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Increment version in README
        run: |
          if grep -q "AppVersion-" README.md; then
            CURRENT_VER=$(grep -o "AppVersion-[0-9]*" README.md | head -n 1)
            NUM=$(echo $CURRENT_VER | cut -d'-' -f2)
            NEXT_NUM=$((NUM + 1))
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            sed -i "s/$CURRENT_VER/AppVersion-$NEXT_NUM ($TIMESTAMP)/g" README.md
          else
            echo "AppVersion-1 ($(date -u +"%Y-%m-%d %H:%M:%S UTC"))" >> README.md
          fi
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git commit -am "Bump version in README with timestamp"
          git push

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Validate PROD Token
        run: |
          if [ "${{ secrets.PROD_TOKEN }}" = "${{ secrets.LOCAL_PROD_TOKEN }}" ]; then
            echo "Token de producción válido."
          else
            echo "Error: El token de producción no coincide."
            exit 1
          fi
