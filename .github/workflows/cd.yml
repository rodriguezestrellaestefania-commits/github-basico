name: CD Workflow (Main)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Desplegado en producción: v1.0.0" >> README.md
          git add README.md
          git commit -m "Actualizada versión en README" || echo "No changes to commit"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  validate-prod:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Prod Environment
        run: echo "Validando entorno de producción en main..."
