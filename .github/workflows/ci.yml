name: CI Workflow (Develop)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update README for feature
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git commit -am "Actualizado README con la nueva feature"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validate DEV Token
        run: |
          if [ "${{ secrets.DEV_TOKEN }}" = "${{ secrets.LOCAL_DEV_TOKEN }}" ]; then
            echo "Token de desarrollo válido."
          else
            echo "Error: El token no coincide."
            exit 1
          fi
