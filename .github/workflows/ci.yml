name: CI Workflow (Develop)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README for feature
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Añadida feature: develop" >> README.md
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizado README con la nueva feature"
          git push origin HEAD:${{ github.head_ref || github.ref_name }} || echo "Nothing to push"

  validate-dev:
    needs: update-readme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Dev Environment
        run: echo "Validando entorno de desarrollo en develop..."
